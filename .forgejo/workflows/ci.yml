name: ci

# Forge runs CI and review. Deploy jobs live in .github/workflows and run only on the GitHub
# mirror.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Only a pull request whose every changed path is a root README or lives under docs/ or
  # docs-site/ is docs-only. Unknown diffs and every other trigger take the full route.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.plan.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: scripts/ci-route.sh "$EVENT_NAME" "$BASE" HEAD

  landing:
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.docs_only == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          # Astro 7 needs Node 22.23.4 or newer; a runner's cached 22 can be older.
          node-version: 24
      - name: Build the site
        working-directory: landing
        run: |
          npm ci --no-audit --no-fund
          npm run build

  docs:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          # Astro 7 needs Node 22.23.4 or newer; a runner's cached 22 can be older.
          node-version: 24
      - name: Check the claims and build the docs
        working-directory: docs-site
        run: |
          npm ci --no-audit --no-fund
          npm run build

  # This remains the required ci/check job. It runs application checks on the full route, skips
  # them for docs-only PRs, and succeeds only after every job selected by the route succeeds.
  check:
    needs: [changes, landing, docs]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - if: needs.changes.result == 'success' && needs.changes.outputs.docs_only == 'false'
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - if: needs.changes.result == 'success' && needs.changes.outputs.docs_only == 'false'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - if: needs.changes.result == 'success' && needs.changes.outputs.docs_only == 'false'
        run: bun install --frozen-lockfile
      - name: Format
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only == 'false'
        run: bun run fmt:check
      - name: Typecheck
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only == 'false'
        run: bun run typecheck
      - name: Lint
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only == 'false'
        run: bun run lint
      - name: Test
        if: needs.changes.result == 'success' && needs.changes.outputs.docs_only == 'false'
        run: bun run test
      - name: Require the selected CI route
        if: always()
        env:
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          LANDING_RESULT: ${{ needs.landing.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
        run: |
          case "$DOCS_ONLY:$CHANGES_RESULT:$LANDING_RESULT:$DOCS_RESULT" in
            true:success:skipped:success|false:success:success:success) ;;
            *) echo "CI route failed: docs_only=$DOCS_ONLY changes=$CHANGES_RESULT landing=$LANDING_RESULT docs=$DOCS_RESULT" >&2; exit 1 ;;
          esac

  claude-triage:
    # Shared kit fragment (claude-ci), Forgejo Actions: the last job of the product's CI
    # workflow, because Forgejo has no workflow_run event. Paste it under `jobs:` and list every
    # other job of the workflow in `needs:`; the rest must stay identical to the master.
    # When a pull request's run fails, Claude reads the failed jobs' log tails and posts or
    # updates one comment: likely flaky or likely real, the most likely cause, three lines.
    # Read-only and a no-op until the repository has a CLAUDE_CI_API_KEY secret. It checks out
    # nothing: the script comes from the base branch and the logs through the API. Forks get
    # no secrets and skip. On a GitHub mirror of the product it does nothing.
    needs: [changes, check, landing, docs]
    if: failure() && github.event_name == 'pull_request' && github.server_url != 'https://github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - name: Is a key set
        id: gate
        env:
          KEY: ${{ secrets.CLAUDE_CI_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::notice::skipped: no CLAUDE_CI_API_KEY"
            echo "on=false" >> "$GITHUB_OUTPUT"
          else
            echo "on=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Fetch the triage script from the base branch
        id: kit
        if: steps.gate.outputs.on == 'true'
        continue-on-error: true
        env:
          TOKEN: ${{ github.token }}
          API: ${{ github.server_url }}/api/v1
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          code=$(curl -sS -o "$RUNNER_TEMP/claude-ci.mjs" -w '%{http_code}' \
            -H "Authorization: token $TOKEN" \
            "$API/repos/$REPO/raw/.github/claude/claude-ci.mjs?ref=$BASE" || true)
          if [ "$code" = 200 ]; then
            echo "on=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::skipped: the base branch has no .github/claude/claude-ci.mjs (HTTP $code)"
            echo "on=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Triage
        if: steps.kit.outputs.on == 'true'
        continue-on-error: true
        timeout-minutes: 8
        env:
          CLAUDE_CI_API_KEY: ${{ secrets.CLAUDE_CI_API_KEY }}
          CLAUDE_CI_MODEL: ${{ vars.CLAUDE_CI_MODEL }}
          CLAUDE_CI_BASE_URL: ${{ vars.CLAUDE_CI_BASE_URL }}
          CI_HOST: forgejo
          CI_API_URL: ${{ github.server_url }}/api/v1
          CI_TOKEN: ${{ github.token }}
          CI_REPO: ${{ github.repository }}
          CI_PR: ${{ github.event.pull_request.number }}
          CI_RUN_ID: ${{ github.run_id }}
        run: node "$RUNNER_TEMP/claude-ci.mjs" triage
